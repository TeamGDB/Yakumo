                          else:
                              require(fields[6:9] == (info.CRC, info.compress_size, info.file_size))
                          result = hashlib.sha256()
                          read = 0
                          with archive.open(info) as stream:
                              while True:
                                  chunk = stream.read(1024 * 1024)
                                  if not chunk:
                                      break
                                  read += len(chunk)
                                  require(read <= info.file_size)
                                  result.update(chunk)
                          require(read == info.file_size)
                          entries[name] = {'sha256': result.hexdigest(), 'size': read, 'crc': info.CRC,
                                           'compressed': info.compress_size, 'method': info.compress_type}
                  require(cursor <= directory_start)
                  if signed:
                      require(directory_start >= 24)
                      raw.seek(directory_start - 24)
                      footer = raw.read(24)
                      require(footer[8:] == b'APK Sig Block 42')
                      size = struct.unpack_from('<Q', footer)[0] + 8
                      require(32 <= size <= 1024 * 1024)
                      block_start = directory_start - size
                      padding = block_start - cursor
                      require(0 <= padding <= 4095)
                      if padding:
                          require(block_start % 4096 == 0)
                          raw.seek(cursor)
                          require(not any(raw.read(padding)))
                      raw.seek(block_start)
                      block = raw.read(size)
                      require(len(block) == size and block[-16:] == b'APK Sig Block 42')
                      require(struct.unpack_from('<Q', block)[0] == size - 8 == struct.unpack_from('<Q', block, size - 24)[0])
                      position, ids = 8, set()
                      while position < size - 24:
                          require(position + 12 <= size - 24)
                          pair_size, identity = struct.unpack_from('<QI', block, position)
                          require(4 <= pair_size <= 512 * 1024 and position + 8 + pair_size <= size - 24)
                          require(identity in (0x7109871a, 0xf05368c0, 0x42726577) and identity not in ids)
                          ids.add(identity)
                          payload = block[position + 12:position + 8 + pair_size]
                          if identity == 0x42726577:
                              require(len(payload) <= 4096 and not any(payload))
                          else:
                              require(bool(payload))
                          position += 8 + pair_size
                      require(position == size - 24 and {0x7109871a, 0xf05368c0} <= ids)
                  else:
                      require(cursor == directory_start)
                  adjusted = bytearray(end)
                  struct.pack_into('<I', adjusted, 16, cursor)
              return {'entries': entries, 'prefix_sha256': checksum(path, 0, cursor),
                      'central_sha256': checksum(path, directory_start, directory_start + directory_size),
                      'normalized_eocd': adjusted.hex()}

          def aggregate(root, output, source, run_id):
              root, output = Path(root), Path(output)
              require(re.fullmatch('[0-9a-f]{40}', source) and re.fullmatch('[1-9][0-9]*', run_id))
              require(root.is_dir() and not root.is_symlink())
              expected = {'nightly-final-' + run_id + '-' + platform for platform in PLATFORMS}
              dirs = list(root.iterdir())
              require({p.name for p in dirs} == expected and all(p.is_dir() and not p.is_symlink() for p in dirs))
              records = []
              payloads = {}
              for platform in PLATFORMS:
                  directory = root / ('nightly-final-' + run_id + '-' + platform)
                  signing = 'verified' if platform == 'android-arm64' else 'not-applicable'
                  record = validate_bundle(directory, platform, source, signing)
                  if platform == 'android-arm64':
                      apk_layout(directory / package_name(platform, source), signed=True)
                  records.append(record)
                  for entry in record['files']:
                      name = entry['name']
                      if name in payloads:
                          require(payloads[name][0] == entry)
                      else:
                          payloads[name] = (entry, directory / name)
              require(len(payloads) == 6 and not output.exists() and not output.is_symlink())
              output.mkdir(mode=0o700)
              files = []
              for name, (entry, path) in sorted(payloads.items()):
                  shutil.copyfile(path, output / name)
                  require(checksum(output / name) == entry['sha256'])
                  files.append(entry)
              (output / 'SHA256SUMS').write_text(''.join(entry['sha256'] + '  ' + entry['name'] + '\n' for entry in files))
              (output / 'build.json').write_text(json.dumps({'schema': 1, 'source': source, 'files': files, 'platforms': records}, indent=2) + '\n')
              release_notes = ('> **Experimental nightly builds, not a stable release. Back up your saves and settings.**\n\n'
                               'For regular play use https://github.com/TeamGDB/Yakumo/releases/latest.\n\n'
                               'Source: https://github.com/TeamGDB/Yakumo/commit/' + source + '\n\n'
                               'Packages: Linux/Steam Deck x86-64, Windows x86-64 portable, macOS arm64 and Android arm64.\n\n'
                               'Automated packaging and privacy checks passed. The Android APK uses the existing release '
                               'certificate with verified v2/v3 signatures. Full device/gameplay testing is not claimed.\n\n'
                               'Use SHA256SUMS to verify downloads. The two FFmpeg archives contain the corresponding '
                               'unmodified library sources. No game files are included.\n')
              (output / 'release-notes.md').write_text(release_notes)
              require(len(list(output.iterdir())) == 9)
              return files

          def main():
              aggregate(os.environ['TRANSFER_ROOT'], os.environ['PUBLIC_ROOT'], os.environ['GITHUB_SHA'], os.environ['GITHUB_RUN_ID'])
              print('Four platform artifacts and both corresponding source offers verified.')

          if __name__ == '__main__':
              try:
                  main()
              except Exception:
                  raise SystemExit('Nightly publication transfer validation failed.')
          PY
      - name: Publish a unique nightly release as Latest in Yakumo-nightly
        env:
          GH_TOKEN: ${{ secrets.NIGHTLY_PUBLISH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          tag="nightly-$(date -u +%Y%m%d)-${GITHUB_SHA:0:12}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          packages=(
            "$PUBLIC_ROOT/yakumo-nightly-${GITHUB_SHA:0:12}-linux-x86_64.tar.gz"
            "$PUBLIC_ROOT/yakumo-nightly-${GITHUB_SHA:0:12}-macos-arm64.zip"
            "$PUBLIC_ROOT/yakumo-nightly-${GITHUB_SHA:0:12}-windows-x86_64-portable.zip"
            "$PUBLIC_ROOT/yakumo-nightly-${GITHUB_SHA:0:12}-android-arm64.apk"
            "$PUBLIC_ROOT/ffmpeg-7.1.5.tar.xz"
            "$PUBLIC_ROOT/ffmpeg-7d0e8420048cffd0ca3883b877ead2390496d0b2.tar.gz"
            "$PUBLIC_ROOT/SHA256SUMS" "$PUBLIC_ROOT/build.json"
          )
          gh release create "$tag" --repo TeamGDB/Yakumo-nightly --target main \
            --latest --title "Nightly ${GITHUB_SHA:0:12} (all platforms)" \
            --notes-file "$PUBLIC_ROOT/release-notes.md" "${packages[@]}"
      - name: Remove transferred publication files
        if: always()
        shell: bash
        run: rm -rf -- "$TRANSFER_ROOT" "$PUBLIC_ROOT"
