                  files.append({'name': filename, 'size': target.stat().st_size, 'sha256': checksum(target)})
              write_record(output, 'android-arm64', source, files, signed=True)
              validate_bundle(output, 'android-arm64', source, 'verified')
              print('Android payload unchanged; release certificate and v2/v3 signatures verified.')

          if __name__ == '__main__':
              try:
                  main()
              except Exception:
                  raise SystemExit('Signed Android transfer validation failed.')
          PY
