              verification = result.stdout.decode('utf-8')
              validate_signed_pair(root / name, candidate, verification)
              require(not output.exists() and not output.is_symlink())
              output.mkdir(mode=0o700)
              files = []
              for original, filename in ((candidate, name), (root / record['files'][1]['name'], record['files'][1]['name'])):
                  target = output / filename
