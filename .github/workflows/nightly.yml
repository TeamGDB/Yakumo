              source = os.environ['GITHUB_SHA']
              root = Path(os.environ['SIGN_INPUT'])
              private = Path(os.environ['SIGN_PRIVATE'])
              output = Path(os.environ['SIGNED_ROOT'])
              record = validate_bundle(root, 'android-arm64', source, 'required')
              name = package_name('android-arm64', source)
              candidate = private / 'signed.apk'
              tool = Path(os.environ['ANDROID_HOME']) / 'build-tools/35.0.0/apksigner'
              result = subprocess.run([str(tool), 'verify', '--verbose', '--print-certs',
                                       '--min-sdk-version', '24', '--max-sdk-version', '35', str(candidate)],
