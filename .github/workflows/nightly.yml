          # nightly-transfer:verify-signed
          import hashlib

          import json

          import os

          from pathlib import Path

          import re

          import shutil

          import stat

          import struct

          import subprocess

          import zipfile

          CERTIFICATE = '1ca2f27cfbcd9ea7d875a8ca002f57866037b19f43aaf449ce87739aee868570'

          SOURCE_PINS = {
              'ffmpeg-7.1.5.tar.xz': 'de668509caf9e35e3cd162473441fdb29538c6d96ed080292b3cf9e6fc5d558f',
              'ffmpeg-7d0e8420048cffd0ca3883b877ead2390496d0b2.tar.gz': '2caafb2bbfb69c0518470651640e71ac7f5fb3117d188bf6ea2d909307a02b1d',
          }

          PLATFORMS = ('linux-x86_64', 'macos-arm64', 'windows-x86_64', 'android-arm64')

          MAX_FILE = 2 * 1024 ** 3

          def require(condition):
              if not condition:
                  raise ValueError('Transferred artifact failed validation.')

          def checksum(path, start=0, end=None):
              result = hashlib.sha256()
              with Path(path).open('rb') as stream:
                  stream.seek(start)
                  remaining = Path(path).stat().st_size - start if end is None else end - start
                  require(remaining >= 0)
                  while remaining:
                      data = stream.read(min(1024 * 1024, remaining))
                      require(bool(data))
                      result.update(data)
                      remaining -= len(data)
              return result.hexdigest()

          def package_name(platform, source):
              require(platform in PLATFORMS and re.fullmatch('[0-9a-f]{40}', source))
              suffix = {'linux-x86_64': '.tar.gz', 'macos-arm64': '.zip',
                        'windows-x86_64': '-portable.zip', 'android-arm64': '.apk'}[platform]
              return 'yakumo-nightly-' + source[:12] + '-' + platform + suffix

          def notes(platform, source):
              return ('> **Experimental nightly build, not a stable release. Back up your saves and settings.**\n\n'
                      'For regular play use https://github.com/TeamGDB/Yakumo/releases/latest.\n\n'
                      'Source: https://github.com/TeamGDB/Yakumo/commit/' + source + '\n\n'
                      'Platform: ' + platform + '.\n\n'
                      'Packaging and privacy checks passed. Full device/gameplay testing is not claimed. '
                      'Use SHA256SUMS to verify downloads. No game files are included.\n')

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  require(key not in result)
                  result[key] = value
              return result

          def validate_bundle(root, platform, source, signing):
              require(platform in PLATFORMS and re.fullmatch('[0-9a-f]{40}', source))
              root = Path(root)
              require(root.is_dir() and not root.is_symlink())
              paths = list(root.iterdir())
              require(len(paths) == 5 and all(p.is_file() and not p.is_symlink() for p in paths))
              for name in ('build.json', 'SHA256SUMS', 'release-notes.md'):
                  require(0 < (root / name).stat().st_size < 16384)
              record = json.loads((root / 'build.json').read_text(), object_pairs_hook=unique_object)
              expected_keys = {'schema', 'source', 'platform', 'files', 'android_signing'}
              if signing == 'verified':
                  expected_keys.add('certificate_sha256')
              require(set(record) == expected_keys and type(record['schema']) is int and record['schema'] == 1)
              require(record['source'] == source and record['platform'] == platform and record['android_signing'] == signing)
              if signing == 'verified':
                  require(platform == 'android-arm64' and record['certificate_sha256'] == CERTIFICATE)
              elif platform == 'android-arm64':
                  require(signing == 'required')
              else:
                  require(signing == 'not-applicable')
              source_name = 'ffmpeg-7d0e8420048cffd0ca3883b877ead2390496d0b2.tar.gz' if platform == 'windows-x86_64' else 'ffmpeg-7.1.5.tar.xz'
              expected = [package_name(platform, source), source_name]
              require(type(record['files']) is list and len(record['files']) == 2)
              require({p.name for p in paths} == {*expected, 'build.json', 'SHA256SUMS', 'release-notes.md'})
              sums = ''
              for entry, name in zip(record['files'], expected):
                  require(type(entry) is dict and set(entry) == {'name', 'size', 'sha256'})
                  require(entry['name'] == name and type(entry['size']) is int and 0 < entry['size'] <= MAX_FILE)
                  require(type(entry['sha256']) is str and re.fullmatch('[0-9a-f]{64}', entry['sha256']))
                  path = root / name
                  require(path.stat().st_size == entry['size'] and checksum(path) == entry['sha256'])
                  if name == source_name:
                      require(entry['sha256'] == SOURCE_PINS[source_name])
                  sums += entry['sha256'] + '  ' + name + '\n'
              require((root / 'SHA256SUMS').read_text() == sums)
              require((root / 'release-notes.md').read_text() == notes(platform, source))
              return record

          def apk_layout(path, signed):
              path = Path(path)
              require(path.is_file() and not path.is_symlink() and 22 <= path.stat().st_size <= MAX_FILE)
              with path.open('rb') as raw:
                  raw.seek(-22, 2)
                  end = raw.read(22)
                  require(end[:4] == b'PK\x05\x06' and end[20:] == b'\0\0')
                  _, disk, directory_disk, count, count2, directory_size, directory_start, comment = struct.unpack('<4s4H2LH', end)
                  require(not disk and not directory_disk and not comment and count == count2 and 0 < count <= 1500)
                  require(directory_start + directory_size == path.stat().st_size - 22)
                  with zipfile.ZipFile(path) as archive:
                      infos = archive.infolist()
                      require(len(infos) == count and not archive.comment)
                      entries, folded, cursor, total = {}, set(), 0, 0
                      for info in sorted(infos, key=lambda item: item.header_offset):
                          name = info.filename
                          require(name and '\\' not in name and len(name) <= 1024
                                  and all(part not in ('', '.', '..') for part in name.rstrip('/').split('/')))
                          require(not any(ord(c) < 32 or ord(c) == 127 for c in name))
                          require(name.casefold() not in folded and not info.comment and not info.flag_bits & 1)
                          folded.add(name.casefold())
                          require(stat.S_IFMT(info.external_attr >> 16) in (0, stat.S_IFREG, stat.S_IFDIR))
                          require(info.header_offset == cursor and 0 <= info.file_size <= 512 * 1024 ** 2)
                          total += info.file_size
                          require(total <= 4 * 1024 ** 3 and info.compress_type in (0, 8))
                          raw.seek(cursor)
                          header = raw.read(30)
                          require(len(header) == 30 and header[:4] == b'PK\x03\x04')
                          fields = struct.unpack('<4s5H3L2H', header)
                          local_name = raw.read(fields[-2])
                          extra = raw.read(fields[-1])
                          encoding = 'utf-8' if fields[2] & 0x800 else 'cp437'
                          require(local_name.decode(encoding) == name and fields[2] == info.flag_bits and fields[3] == info.compress_type)
                          cursor += 30 + len(local_name) + len(extra) + info.compress_size
                          if info.flag_bits & 8:
                              raw.seek(cursor)
                              descriptor = raw.read(16)
                              if descriptor[:4] == b'PK\x07\x08':
                                  descriptor, amount = descriptor[4:], 16
                              else:
                                  descriptor, amount = descriptor[:12], 12
                              require(len(descriptor) == 12 and struct.unpack('<3L', descriptor) == (info.CRC, info.compress_size, info.file_size))
                              cursor += amount
                          else:
                              require(fields[6:9] == (info.CRC, info.compress_size, info.file_size))
                          result = hashlib.sha256()
                          read = 0
                          with archive.open(info) as stream:
                              while True:
                                  chunk = stream.read(1024 * 1024)
                                  if not chunk:
                                      break
                                  read += len(chunk)
                                  require(read <= info.file_size)
                                  result.update(chunk)
                          require(read == info.file_size)
                          entries[name] = {'sha256': result.hexdigest(), 'size': read, 'crc': info.CRC,
                                           'compressed': info.compress_size, 'method': info.compress_type}
                  require(cursor <= directory_start)
                  if signed:
                      require(directory_start >= 24)
                      raw.seek(directory_start - 24)
                      footer = raw.read(24)
                      require(footer[8:] == b'APK Sig Block 42')
                      size = struct.unpack_from('<Q', footer)[0] + 8
                      require(32 <= size <= 1024 * 1024)
                      block_start = directory_start - size
                      padding = block_start - cursor
                      require(0 <= padding <= 4095)
                      if padding:
                          require(block_start % 4096 == 0)
                          raw.seek(cursor)
                          require(not any(raw.read(padding)))
                      raw.seek(block_start)
                      block = raw.read(size)
                      require(len(block) == size and block[-16:] == b'APK Sig Block 42')
                      require(struct.unpack_from('<Q', block)[0] == size - 8 == struct.unpack_from('<Q', block, size - 24)[0])
                      position, ids = 8, set()
                      while position < size - 24:
                          require(position + 12 <= size - 24)
                          pair_size, identity = struct.unpack_from('<QI', block, position)
                          require(4 <= pair_size <= 512 * 1024 and position + 8 + pair_size <= size - 24)
                          require(identity in (0x7109871a, 0xf05368c0, 0x42726577) and identity not in ids)
                          ids.add(identity)
                          payload = block[position + 12:position + 8 + pair_size]
                          if identity == 0x42726577:
                              require(len(payload) <= 4096 and not any(payload))
                          else:
                              require(bool(payload))
                          position += 8 + pair_size
                      require(position == size - 24 and {0x7109871a, 0xf05368c0} <= ids)
                  else:
                      require(cursor == directory_start)
                  adjusted = bytearray(end)
                  struct.pack_into('<I', adjusted, 16, cursor)
              return {'entries': entries, 'prefix_sha256': checksum(path, 0, cursor),
                      'central_sha256': checksum(path, directory_start, directory_start + directory_size),
                      'normalized_eocd': adjusted.hex()}

