              require(type(text) is str and len(text) <= 65536)
              certs = re.findall(r'^Signer #([0-9]+) certificate SHA-256 digest: ([0-9a-fA-F]{64})$', text, re.M)
              require([(number, digest.lower()) for number, digest in certs] == [('1', CERTIFICATE)])
              require(re.search(r'^Number of signers: 1$', text, re.M))
              for scheme, expected in (('v1', 'false'), ('v2', 'true'), ('v3', 'true')):
                  require(re.search(r'^Verified using ' + scheme + r' scheme .*: ' + expected + '$', text, re.M))

          def write_record(root, platform, source, files, signed=False):
              record = {'schema': 1, 'source': source, 'platform': platform, 'files': files,
                        'android_signing': 'verified' if signed else 'not-applicable'}
              if signed:
                  record['certificate_sha256'] = CERTIFICATE
              (root / 'build.json').write_text(json.dumps(record, indent=2) + '\n')
              (root / 'SHA256SUMS').write_text(''.join(item['sha256'] + '  ' + item['name'] + '\n' for item in files))
              (root / 'release-notes.md').write_text(notes(platform, source))

          def validate_signed_pair(unsigned, signed, verification):
              before = apk_layout(unsigned, signed=False)
              after = apk_layout(signed, signed=True)
              require(before == after)
              verify_tool_output(verification)

