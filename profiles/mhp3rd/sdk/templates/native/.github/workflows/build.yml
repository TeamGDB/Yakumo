# Builds the mod for every platform Yakumo runs on and packs the result as a
# single .ymod file, ready to drop on Yakumo's window. A copy of this folder
# in a repository of its own builds on every push.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # The Yakumo branch or tag whose SDK headers the mod is built against. Pin
  # it to a release tag, so the mod builds against the headers of the
  # Yakumo it was tested with; main follows the newest headers.
  YAKUMO_REF: main
  MOD_NAME: example_mod

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows-x64, os: windows-2022 }
          - { platform: linux-x64, os: ubuntu-22.04 }
          - { platform: macos-arm64, os: macos-14 }
          - { platform: android-arm64, os: ubuntu-22.04 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch the SDK headers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: TeamGDB/Yakumo
          ref: ${{ env.YAKUMO_REF }}
          path: yakumo
          sparse-checkout: profiles/mhp3rd/sdk/include
          sparse-checkout-cone-mode: false
      - name: Configure
        shell: bash
        run: |
          args=(-DCMAKE_BUILD_TYPE=Release -DYAKUMO_PLATFORM=${{ matrix.platform }}
                -DYAKUMO_SDK_DIR="$GITHUB_WORKSPACE/yakumo/profiles/mhp3rd/sdk/include")
          case "${{ matrix.platform }}" in
            android-arm64)
              args+=(-DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake"
                     -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-29 -DANDROID_STL=c++_static) ;;
            macos-arm64)
              args+=(-DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0) ;;
          esac
          cmake -S . -B build "${args[@]}"
      - name: Build
        run: cmake --build build --config Release
      - name: Install into the mod folder
        run: cmake --install build --config Release --prefix mod
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.platform }}
          path: mod

  package:
    needs: native
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-*
          path: mod
          merge-multiple: true
      - name: Pack the .ymod
        run: cd mod && zip -r -X "../$MOD_NAME.ymod" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.MOD_NAME }}
          path: ${{ env.MOD_NAME }}.ymod
